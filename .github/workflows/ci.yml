# ----- Continuous integration for CareCircle.
# Runs on every push and pull request: lint, type check, unit tests and a
# production build, on Node 22 (the version the Dockerfile uses).

name: CI

on:
   push:
   pull_request:

permissions:
   contents: read

jobs:
   check:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      steps:
         - name: Check out the code
           uses: actions/checkout@v4

         - name: Set up Node 22
           uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm

         - name: Install dependencies from the lock file
           run: npm ci

         - name: Lint
           run: npm run lint

         - name: Type check
           run: npm run typecheck

         - name: Unit tests
           run: npm test

         - name: Production build
           run: npm run build
