# ----- CareCircle on Render's free plan. Import this file from the Render
# dashboard ("New" then "Blueprint") after connecting the repository.
# Nothing here costs money: the service is a free Docker web service, and
# storage is Firestore on the Firebase Spark plan.
#
# APP_BASE_URL, FIREBASE_CREDENTIALS, GEMINI_API_KEY and the SMTP_* values
# are marked "sync: false", so Render asks for them once in the dashboard
# instead of keeping secrets in this file. Session and cron secrets are
# generated by Render.

services:
   - type: web
      name: carecircle
      runtime: docker
      plan: free
      region: singapore
      dockerfilePath: ./Dockerfile
      healthCheckPath: /api/health
      autoDeploy: true
      envVars:
         - key: NODE_ENV
           value: production
         # ----- Signs sessions and email links. Render makes a random one.
         - key: SESSION_SECRET
           generateValue: true
         # ----- Shared secret for the reminder check. Copy it into the
         # cron job that posts to /api/cron/tick.
         - key: CRON_SECRET
           generateValue: true
         # ----- Firestore on the Firebase Spark plan.
         - key: STORE_BACKEND
           value: firestore
         - key: FIREBASE_CREDENTIALS
           sync: false
         # ----- The deployed address, with https://, used in emails.
         - key: APP_BASE_URL
           sync: false
         # ----- Free Gemini key from Google AI Studio. Leave empty to
         # type prescriptions by hand instead.
         - key: GEMINI_API_KEY
           sync: false
         - key: GEMINI_MODEL
           value: gemini-2.5-flash
         # ----- Optional email over SMTP. Without these, emails are
         # recorded in the delivery log and not sent.
         - key: SMTP_HOST
           sync: false
         - key: SMTP_PORT
           value: 465
         - key: SMTP_USER
           sync: false
         - key: SMTP_PASS
           sync: false
         - key: SMTP_FROM
           sync: false
