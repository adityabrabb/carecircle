# ----- CareCircle on Render's free plan. Import this file from the Render
# dashboard with New then Blueprint, after connecting the repository.
# Nothing here costs money: the service is a free Docker web service that
# runs the existing Dockerfile.
#
# SESSION_SECRET and CRON_SECRET are generated by Render at first deploy.
# APP_BASE_URL, GEMINI_API_KEY and the SMTP_* values are marked
# "sync: false", so Render asks for them once in the dashboard and no
# secret is ever kept in this file.

services:
   - type: web
     name: carecircle
     runtime: docker
     plan: free
     healthCheckPath: /
     autoDeploy: true
     envVars:
        # ----- Storage in the process. Nothing to set up, and every
        # circle resets when the free service restarts. Switch this to
        # "firestore" after adding FIREBASE_CREDENTIALS to keep data.
        - key: STORE_BACKEND
          value: memory
        # ----- Firestore on the Firebase free plan. The service account
        # JSON, pasted from the Firebase console, works outside Google
        # Cloud. GOOGLE_CLOUD_PROJECT is only read when the JSON omits
        # its project.
        - key: FIREBASE_CREDENTIALS
          sync: false
        - key: GOOGLE_CLOUD_PROJECT
          sync: false
        # ----- Signs sessions and email links. Render makes a random
        # value, so every restart keeps the same secret.
        - key: SESSION_SECRET
          generateValue: true
        # ----- Shared secret for the reminder check. Copy it into the
        # cron job that posts to /api/cron/tick.
        - key: CRON_SECRET
          generateValue: true
        # ----- The deployed address, with https://, used in emails.
        - key: APP_BASE_URL
          sync: false
        # ----- Free Gemini key from Google AI Studio. Leave empty to
        # type prescriptions by hand instead.
        - key: GEMINI_API_KEY
          sync: false
        - key: GEMINI_MODEL
          value: gemini-2.5-flash
        # ----- Optional email over SMTP. Without these, emails are
        # recorded in the delivery log and not sent.
        - key: SMTP_HOST
          sync: false
        - key: SMTP_PORT
          sync: false
        - key: SMTP_USER
          sync: false
        - key: SMTP_PASS
          sync: false
        - key: SMTP_FROM
          sync: false
